
name: Build APKs, Generate Code Report and Publish

on:
  push:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build, Report and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout complete Git history
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Generate detailed code change report
      - name: Generate Code Change Report
        env:
          APP_NAME: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          mkdir -p output_apks

          if [ -z "$BASE_SHA" ] || \
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              BASE_SHA=$(git rev-parse HEAD^)
            else
              BASE_SHA=$(git hash-object -t tree /dev/null)
            fi
          fi

          REPORT="output_apks/${APP_NAME}-Change-Report.md"

          {
            echo "# ${APP_NAME} - Code Change Report"
            echo ""
            echo "## Commit Information"
            echo ""
            echo "- **Application:** ${APP_NAME}"
            echo "- **Event:** ${EVENT_NAME}"
            echo "- **Branch:** ${GITHUB_REF_NAME}"
            echo "- **Commit ID:** ${HEAD_SHA}"
            echo "- **Previous Commit:** ${BASE_SHA}"
            echo "- **Author:** $(git show -s --format='%an' "$HEAD_SHA")"
            echo "- **Author Email:** $(git show -s --format='%ae' "$HEAD_SHA")"
            echo "- **Commit Message:** $(git show -s --format='%s' "$HEAD_SHA")"
            echo "- **Date:** $(git show -s --format='%ci' "$HEAD_SHA")"
            echo ""
            echo "## Change Statistics"
            echo ""
            git diff --stat --find-renames "$BASE_SHA" "$HEAD_SHA" || true
            echo ""
            echo "## Changed Files"
            echo ""
            echo '```text'
            git diff --name-status --find-renames "$BASE_SHA" "$HEAD_SHA" || true
            echo '```'
            echo ""
            echo "## Line Changes"
            echo ""
            echo '```text'
            git diff --numstat --find-renames "$BASE_SHA" "$HEAD_SHA" || true
            echo '```'
            echo ""
            echo "## Complete Code Changes"
            echo ""
            echo "The following unified diff shows removed code (-),"
            echo "added code (+), file names and old/new line positions."
            echo ""
            echo '```diff'
            git diff --no-ext-diff --find-renames --unified=3 \
              "$BASE_SHA" "$HEAD_SHA" || true
            echo '```'
            echo ""
            echo "---"
            echo "Generated automatically by GitHub Actions."
          } > "$REPORT"

          echo "Report generated:"
          ls -lh "$REPORT"

      # 4. Build Debug APK
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 6. Prepare APKs
      - name: Prepare and Verify APKs
        env:
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          cp "$DEBUG_APK" "output_apks/${APP_NAME}-Debug.apk"
          cp "$RELEASE_APK" "output_apks/${APP_NAME}-Release.apk"

          ls -lh output_apks/

      # 7. Upload workflow artifacts
      - name: Upload APKs and Code Report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-Build-${{ github.run_number }}
          path: output_apks/*
          if-no-files-found: error
          retention-days: 30

      # 8. Publish files into All-Release repository
      - name: Push Files to All-Release
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.RELEASETOKEN }}
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [ -z "$TOKEN" ]; then
            echo "RELEASETOKEN secret is missing."
            exit 1
          fi

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://github.com/Latikesh0/All-Release.git target_repo

          cd target_repo

          git remote set-url origin \
            "https://x-access-token:${TOKEN}@github.com/Latikesh0/All-Release.git"

          mkdir -p "$APP_NAME"

          cp "../output_apks/${APP_NAME}-Debug.apk" "$APP_NAME/"
          cp "../output_apks/${APP_NAME}-Release.apk" "$APP_NAME/"
          cp "../output_apks/${APP_NAME}-Change-Report.md" "$APP_NAME/"

          git add -f -- "$APP_NAME/"

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update ${APP_NAME} build and code report #${GITHUB_RUN_NUMBER}"
            git push origin HEAD:main
          fi

      # 9. Create a NEW GitHub Release for every successful push
      - name: Create New GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          repository: Latikesh0/All-Release
          token: ${{ secrets.RELEASETOKEN }}
          tag_name: "${{ github.event.repository.name }}-build-${{ github.run_id }}-${{ github.run_attempt }}"
          name: "${{ github.event.repository.name }} Build #${{ github.run_number }}"
          target_commitish: main
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output_apks/${{ github.event.repository.name }}-Debug.apk
            output_apks/${{ github.event.repository.name }}-Release.apk
            output_apks/${{ github.event.repository.name }}-Change-Report.md
